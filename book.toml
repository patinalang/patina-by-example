[book]
title = "Patina By Example"
description = "Patina by Example (PBE) is a collection of runnable examples that illustrate various Patina concepts."
authors = ["The Rust Community", "Konrad Zemek"]

[output.html.playpen]
editable = true
line-numbers = true

[output.html.fold]
enable = true

[output.html]
git-repository-url = "https://github.com/patina-lang/patina-by-example"
edit-url-template = "https://github.com/patina-lang/patina-by-example/edit/main/{path}"
hash-files = true
additional-css = [
  "theme/css/language-picker.css",
]

[output.html.search]
use-boolean-and = true

[output.linkcheck]

[rust]
edition = "2021"

[build]

[preprocessor.gettext]
optional = true
after = ["links"]
